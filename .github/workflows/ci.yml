name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quickpark_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      # Satisfies env validation at build time; e2e tests use the TEST_* URLs.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quickpark_test?schema=public
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quickpark_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
